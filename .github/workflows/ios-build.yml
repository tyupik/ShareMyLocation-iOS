name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка XcodeGen
        run: brew install xcodegen

      - name: Генерация Xcode-проекта
        run: xcodegen generate

      # Кэш SwiftPM-пакетов: ключ по project.yml — резолв Firebase долгий, без кэша каждая сборка 10+ минут
      - name: Кэш SwiftPM
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-

      - name: Резолв SwiftPM-зависимостей
        run: >
          xcodebuild -project ShareMyLocation.xcodeproj
          -scheme ShareMyLocation
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          -resolvePackageDependencies

      - name: Сборка Release без подписи
        run: >
          xcodebuild -project ShareMyLocation.xcodeproj
          -scheme ShareMyLocation
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build 2>&1 | tee build.log

      # Хвост лога с ошибками — в артефакт: подробности падения не теряются
      - name: Ошибки сборки в артефакт
        if: failure()
        run: |
          grep -E "error:|warning: |FAILED|fatal" build.log | tail -100 > build-errors.txt || true
          tail -200 build.log >> build-errors.txt || true

      - name: Лог сборки при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-errors.txt
          if-no-files-found: ignore

      - name: Упаковка .app в Payload
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ShareMyLocation.app Payload/

      - name: Архивация unsigned .ipa
        run: zip -r ShareMyLocation-unsigned.ipa Payload

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ShareMyLocation-unsigned-ipa
          path: ShareMyLocation-unsigned.ipa
